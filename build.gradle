plugins { id 'java' }

version = '1.0'

sourceSets {
    main.java.srcDirs = ['src']
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly files('libs/Mindustry.jar')
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.release = 17
}

jar {
    archiveFileName = "SectorStrike.jar"
    from(rootDir) { include "mod.json" }
    from("assets/") { include "**" }
}
